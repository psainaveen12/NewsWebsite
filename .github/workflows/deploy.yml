name: Deploy

on:
  push:
    branches:
      - main
      - awsPlatformDeployTest
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy
        required: false
        default: main

concurrency:
  group: ieltstask-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || secrets.EC2_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || secrets.EC2_SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER || secrets.EC2_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.EC2_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_branch || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing GitHub secret: SSH_PRIVATE_KEY or EC2_SSH_KEY"; exit 1; }
          test -n "$SSH_HOST" || { echo "Missing GitHub secret: SSH_HOST or EC2_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing GitHub secret: SSH_USER or EC2_SSH_USER"; exit 1; }

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2 host
        run: |
          REMOTE_PATH="${DEPLOY_PATH:-\$HOME/apps/ieltstask}"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd \"$REMOTE_PATH\" && DEPLOY_BRANCH=\"$DEPLOY_BRANCH\" bash scripts/deploy.sh \"$DEPLOY_BRANCH\""
