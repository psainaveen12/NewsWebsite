<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <meta name="description" content="Curated articles and analysis from IELTSTask Newsroom.">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="{{ app_name }} home">
        <span class="brand-mark">N</span>
        <span>
          <strong>IELTSTask</strong>
          <small>Newsroom</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="/">Latest</a>
        {% if is_admin %}
          <a href="/admin">Import desk</a>
          <form action="/logout" method="post">
            <input type="hidden" name="csrf" value="{{ csrf_token }}">
            <button class="nav-button" type="submit">Sign out</button>
          </form>
        {% else %}
          <a href="/login">Admin</a>
        {% endif %}
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">
      <div>
        <strong>IELTSTask Newsroom</strong>
        <p>Article metadata is curated from the original publishers.</p>
      </div>
      <a href="/">news.ieltstask.com</a>
    </footer>
  </div>
</body>
</html>
